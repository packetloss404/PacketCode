name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26.3'
  GOLANGCI_LINT_VERSION: v2.9.0
  GOVULNCHECK_VERSION: v1.3.0
  GORELEASER_VERSION: v2.9.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_flags: '-race -coverprofile=coverage.out'
          - os: macos-latest
            test_flags: ''
          - os: windows-latest
            test_flags: ''
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod verify
      - name: Runner facts
        if: runner.os == 'Windows'
        run: |
          echo "cpus=$env:NUMBER_OF_PROCESSORS"
          (Get-CimInstance Win32_Processor).Name
          (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
      - run: go test -count=1 ${{ matrix.test_flags }} ./...
        env:
          PACKETCODE_DIAG_FILE: ${{ runner.temp }}/hook-diag.txt
      # DIAGNOSTIC (temporary): timings recorded from inside the real suite run,
      # written to a file because go test discards a passing package's stderr.
      - name: DIAG in-suite hook timings
        if: always() && runner.os == 'Windows'
        run: Get-Content "${{ runner.temp }}/hook-diag.txt"
      # DIAGNOSTIC (temporary): tiered measurement of Windows hook spawn cost.
      - name: DIAG hook spawn timing
        if: always() && runner.os == 'Windows'
        env:
          PACKETCODE_HOOK_TIMING: '1'
        run: go test -count=1 -v -run TestHookTimingDiagnostics ./internal/hooks/

  tui-golden:
    name: TUI golden and protocol safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-tui.txt
      - run: python -m pip install -r scripts/requirements-tui.txt
      - run: make tui-golden-check

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X main.version=ci -X main.commit=${GITHUB_SHA::7}" \
            -o "dist/packetcode-${GOOS}-${GOARCH}${ext}" \
            ./cmd/packetcode

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
            binary: ./packetcode
          - os: macos-latest
            exe: ''
            binary: ./packetcode
          - os: windows-latest
            exe: '.exe'
            binary: '.\packetcode.exe'
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build native CLI
        run: go build -trimpath -ldflags "-s -w -X main.version=ci -X main.commit=${{ github.sha }}" -o packetcode${{ matrix.exe }} ./cmd/packetcode
      - name: Smoke version
        run: ${{ matrix.binary }} --version
      - name: Smoke help
        run: ${{ matrix.binary }} --help
      - name: Smoke headless run help
        run: ${{ matrix.binary }} run --help

  # The release pipeline, exercised on every push rather than first exercised
  # by tagging.
  #
  # `goreleaser check` validates the configuration file and nothing else. It
  # cannot tell you that the build hooks run, that six archives come out, that
  # the checksums match, or that the licence is inside them -- and those are
  # what break. A tag is the worst moment to learn any of it, because the
  # version number is already spent.
  release-dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: goreleaser/goreleaser-action@v7.2.1
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      # No secrets and no OIDC token here, so the signing steps take their skip
      # paths -- which is itself worth exercising, since that is the path every
      # fork and every pull request takes.
      - uses: goreleaser/goreleaser-action@v7.2.1
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish
      - run: ./scripts/check-release-artifacts.sh dist
      - name: Installer signature logic
        run: bash scripts/test-install-verify.sh
      # Prove the built binary runs, not merely that it was produced. A
      # cross-compile that emits a broken amd64 Linux binary passes every other
      # check in this job.
      - run: |
          tar -xzf dist/packetcode-linux-amd64.tar.gz -C dist packetcode
          ./dist/packetcode --version
